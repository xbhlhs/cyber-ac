#
#   # 测试框架
#   test_framework: "custom"              # custom / CUnit / Unity
#   test_options:
#     timeout_seconds: 30
#     output_format: "junit"             #   junit / tap / custom

# ── 项目制品目录 ─────────────────────────────────────────
# 定义项目各类型制品的存放目录 (相对于项目根目录)。
# PLA生成expected_outputs时使用这些路径。
#
# artifacts:
#   requirements: "requirements/"         # SR / HLR / LLR 需求文档
#   models: "models/"                     # SysML / UML 模型文件
#   source: "src/"                        # C/C++ 源代码
#   tests: "tests/"                       # 测试用例、测试规程
#   evidence: "evidence/"                 # 过程证据、追溯矩阵
#   build: "build/"                       # 编译产物
#   docs: "docs/"                         # 可选: 设计文档、评审材料

