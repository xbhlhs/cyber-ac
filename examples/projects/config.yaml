#     # - "-Wshadow"
#
#   embedded_compiler: "arm-none-eabi-gcc"  # 嵌入式交叉编译器
#   embedded_compiler_flags:
#     - "-mcpu=cortex-m4"
#     - "-mthumb"
#     - "-std=c11"
#     - "-ffreestanding"
#     - "-Wall"
#     - "-Wextra"
#     - "-fno-common"
#
#   target: "Cortex-M4"                   # 目标处理器
#   target_spec:                          # 目标详细规格
#     architecture: "ARMv7E-M"
#     fpu: "FPv4-SP"                      #   浮点单元
#     clock_mhz: 168
#     ram_kb: 128
#     flash_kb: 512
#
#   # 构建系统
#   build_system: "make"
