# Company Standards — Active Config (sr1, DAL D)

company_standards:
  model_policy: "model_optional"        # Allow as_dal default
  coding_standard: "MISRA C:2012"       # MISRA C guideline
  compiler:
    primary: "gcc"
    secondary: "arm-none-eabi-gcc"
    flags_host: ["-Wall", "-Wextra", "-std=c11", "-pedantic"]
    cross_flags: ["-mcpu=cortex-m4", "-mthumb", "-ffunction-sections", "-fdata-sections"]
  review_policy:
    requirement_review: "required"       # SR/HLR/LLR require human review at all DAL
    code_review: "required"             # Source code requires peer review
    model_review: "optional"            # Model review optional at DAL D
  testing_policy:
    unit_testing: "required"
    integration_testing: "required"
    coverage_target: "statement"        # DAL D only requires statement coverage (if any)
  documentation:
    language: "Chinese"                 # Primary language
    formatting: "Chinese technical writing standard"
    table_format: "Markdown tables"
