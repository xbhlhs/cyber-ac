# ── 模型分类 ─────────────────────────────────────────────
# model_types:
#   specification:
#     name: "规格模型 (Specification Model)"
#     description: "描述软件需求的抽象表达"
#     example: "SysML BDD/IBD/需求图表达HLR"
#     verification: "对应HLR验证目标 (A3-*)，加上MB.A-3专项检查"
#
#   design:
#     name: "设计模型 (Design Model)"
#     description: "描述软件内部结构的模型"
#     example: "UML类图/状态机图/活动图表达LLR"
#     verification: "对应LLR验证目标 (A4-*)，加上MB.A-3专项检查"

# ── 计划过程要求 ─────────────────────────────────────────
# 项目计划中必须包含模型策略说明。
#
# planning:
#   model_standards_required: true
#
#   model_standards:
#     - name: "建模语言和表示法"
#       description: "规定使用的建模语言 (SysML/UML/Capella等) 及其版本"
#       example: "SysML v1.6 + UML 2.5.1"
#
#     - name: "模型结构、命名、文档规范"
#       description: "包结构、元素命名规则、注释和文档要求"
#       example: "包命名: 系统→子系统→功能模块; 元素命名: 类型简写_功能名"
#
#     - name: "模型与需求/代码追溯规则"
#       description: "模型元素与SR/LLR/代码之间的追溯链接规则"
#       example: "每个Block必须关联至少一个HLR ID"
#
#     - name: "模型配置管理和变更控制规则"
#       description: "模型版本管理、基线化、变更审批流程"
#       example: "模型文件纳入Git管理，冻结后需CR变更"
#
#   # 工具鉴定
#   tool_qualification:
#     description: "模型工具需工具鉴定 TQL-1~5"
#     tql_levels:
#       - "TQL-1: 工具输出不验证即使用 (需最高鉴定)"
#       - "TQL-5: 工具输出被独立验证 (最低鉴定)"
#     note: "如果模型生成代码且该代码不再人工审查，则代码生成器需TQL-1鉴定"

