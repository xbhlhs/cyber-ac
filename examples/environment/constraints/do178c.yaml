    applicable_DAL: [A, B, C, D]
    do178c_ref: "6.4.e"
    test_type: "compatibility"
    coverage_required: false

structural_coverage:
  - id: "A7-5"
    desc: "Modified Condition/Decision Coverage (MC/DC)"
