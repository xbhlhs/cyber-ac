# SR-1 项目配置
# 本项目强制模型驱动路径: 需要详细设计文档 + UML模型

project:
  id: "SR-1"
  name: "FUN1数据对比输出"
  dal_level: "D"

# 项目路径约束 — 强制模型驱动 + 文本模型混合表达
project_path_constraints:
  model_policy: "required"          # 强制模型 (即使DAL D)
  skip_detailed_design: false       # 需要详细设计文档
  mixed_mode: "text_model_mixed"    # 文本 + UML模型混合

# 适用的DO-178C目标 (DAL D: 25 objectives, 无独立性)
do178c_applicable:
  hlr_verification: ["A3-1","A3-2","A3-6"]
  llr_verification: []
  coding_verification: []
  testing: ["A6-1","A6-2","A6-5"]
  structural_coverage: []
