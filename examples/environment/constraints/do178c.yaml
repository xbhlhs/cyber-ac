# ============================================================
# DO-178C 约束模板 — 全量配置 (注释版)
# ============================================================
#
# 来源: RTCA DO-178C (2011) Annex A Tables A-1~A-10
# 符号: ● = 满足目标(需独立性) ○ = 满足目标 blank = 不要求
#
# 本文件展示完整可配的目标表。实际使用:
#   复制到 environment/constraints/do178c.yaml 并修改。
# ============================================================

# ── 元数据 ───────────────────────────────────────────────
# metadata:
#   standard: "RTCA DO-178C"
#   version: "2011"
#   doc_id: "DO-178C"                 # 文档编号
#   title: "Software Considerations in Airborne Systems and Equipment Certification"
#   publisher: "RTCA, Inc."
#   url: "https://www.rtca.org/"

# ── DAL 等级定义 (Section 2.3.3) ─────────────────────────
# 故障条件分类 → DAL等级 → 目标数量 → 独立性要求
#
# dal_levels:
#   A:
#     failure_condition: "Catastrophic"        # 灾难性: 妨碍安全飞行和着陆
#     description: "失效将导致灾难性后果"
#     objective_count: 66
#     independence_required: true
#     with_independence: 25                     # 需要独立性的目标数
#
#   B:
#     failure_condition: "Hazardous/Severe-Major"  # 危害性/严重重大
#     description: "失效将严重影响安全裕度或机组能力"
#     objective_count: 65
#     independence_required: true
#     with_independence: 14
#
#   C:
#     failure_condition: "Major"                # 重大
#     description: "失效将显著降低安全裕度或增加机组工作负担"
#     objective_count: 58
#     independence_required: false
#     with_independence: 2
#
#   D:
#     failure_condition: "Minor"                # 轻微
#     description: "失效不会显著降低飞机安全性"
#     objective_count: 25
#     independence_required: false
#     with_independence: 0
#
#   E:
#     failure_condition: "No Safety Effect"     # 无安全影响
#     description: "失效不影响飞机运行安全"
#     objective_count: 0
#     independence_required: false
#     with_independence: 0

# ── 六大软件生命周期过程 (Section 3.1) ──────────────────
#
# lifecycle_processes:
#   - planning                            # 计划过程
#   - development_requirements            # 开发过程-需求
#   - development_design                  # 开发过程-设计
#   - development_coding                  # 开发过程-编码
#   - development_integration            # 开发过程-集成
#   - verification                        # 验证过程
#   - configuration_management            # 配置管理
#   - quality_assurance                   # 质量保证
#   - certification_liaison               # 审定联络

# ============================================================
# Annex A 过程目标
# ============================================================
# 字段说明:
#   id             — 目标编号 (e.g. A3-1)
#   desc           — 目标描述
#   applicable_DAL — 哪些DAL等级适用此目标
#   independence   — 哪些DAL等级需要独立性验证
#   do178c_ref     — DO-178C原文引用
# ============================================================

# ── Table A-3: HLR 需求验证目标 (§6.3.1) ─────────────────
# 验证高层需求与系统需求的符合性。
#
# hlr_verification:
#   - id: "A3-1"
#     desc: "HLR comply with system requirements"
#     applicable_DAL: [A, B, C, D]
#     independence: [A, B]
#     do178c_ref: "6.3.1.a"
#     evidence_type: "review"              # review / analysis / test
#
#   - id: "A3-2"
#     desc: "HLR are accurate and consistent"
#     applicable_DAL: [A, B, C, D]
#     independence: [A, B]
#     do178c_ref: "6.3.1.b"
#     evidence_type: "review"
#
#   - id: "A3-3"
#     desc: "HLR are compatible with target computer"
#     applicable_DAL: [A, B]
#     independence: []
#     do178c_ref: "6.3.1.c"
#     evidence_type: "analysis"
#
#   - id: "A3-4"
#     desc: "HLR are verifiable"
#     applicable_DAL: [A, B, C]
#     independence: []
#     do178c_ref: "6.3.1.d"
#     evidence_type: "review"
#
#   - id: "A3-5"
#     desc: "HLR conform to standards"
#     applicable_DAL: [A, B, C]
#     independence: []
#     do178c_ref: "6.3.1.e"
#     evidence_type: "review"
#
#   - id: "A3-6"
#     desc: "HLR are traceable to system requirements"
#     applicable_DAL: [A, B, C, D]
#     independence: []
#     do178c_ref: "6.3.1.f"
#     evidence_type: "analysis"
#
#   - id: "A3-7"
#     desc: "Algorithms are accurate"
#     applicable_DAL: [A, B, C]
#     independence: [A, B]
#     do178c_ref: "6.3.1.g"
#     evidence_type: "analysis"

