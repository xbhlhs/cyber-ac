# ============================================================
# 约束加载映射 — PLA各层使用约束的方式
# ============================================================
# PLA的L1~L5层在需要时按以下映射加载约束子集。
#
# layer_constraint_usage:
#   L1_perception:
#     purpose: "检查DA输出物是否满足对应DAL等级的目标要求"
#     loads:
#       - hlr_verification
#       - llr_verification
#       - coding_verification
#       - testing
#       - structural_coverage
#     usage: "根据当前活动类型和DAL等级，筛选applicable_DAL包含当前DAL的目标，逐项检查"
#
#   L3_execution:
#     purpose: "将DA执行相关的约束注入Task Context"
#     loads:
#       - hlr_verification
#       - llr_verification
#       - coding_verification
#     usage: "在dispatch前，将当前DAL等级适用的目标作为constraints字段注入TaskContext"
#
#   L4_correction:
#     purpose: "偏差根因分析时引用标准条款作为判定依据"
#     loads:
#       - hlr_verification
#       - llr_verification
#       - coding_verification
#       - testing
#     usage: "当发现偏差时，引用对应的do178c_ref条款进行归类"
#
#   L5_steady_state:
#     purpose: "证据包归档需对齐DO-178C Section 11数据项要求"
#     loads:
#       - full_annex_a
#       - section_11_data_items
#     usage: "归档时检查CC1/CC2数据项完整性"

