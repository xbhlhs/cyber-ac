# ============================================================
# 工程环境配置 — 全量模板 (注释版)
# ============================================================
#
# 本文件展示工程环境的所有可配置项及其语义说明。
# 实际使用: 复制到 environment/config.yaml 并取消注释所需项目。
#
# 工程环境配置定义 PLA/DA Agent 运行的工程环境，不绑定任何具体项目。
# 项目特定约束见 projects/{project_id}/config.yaml
# ============================================================

# ── 标准库路径 ──────────────────────────────────────────
# PLA/DA各层按需引用的标准规范文件路径。
# 路径支持:
#   - 相对路径 (相对于本工作区根目录)
#   - $HOME 环境变量展开
#   - 绝对路径
#
# standards:
#   do178c: "environment/constraints/do178c.yaml"        # DO-178C Annex A 目标表
#   do331:  "environment/constraints/do331.yaml"         # DO-331 MBE补充标准
#   arp4754b: "$HOME/wiki/raw/standards/SAE ARP 4754B-2023.pdf"
#   arp4761a: "$HOME/wiki/raw/standards/SAE ARP 4761A-2023.pdf"
#   ccar21: "$HOME/wiki/raw/standards/CCAR-21.pdf"       # 民用航空产品和零部件合格审定规定
#   ccar25: "$HOME/wiki/raw/standards/CCAR-25.pdf"       # 运输类飞机适航标准
#   # 可扩展: 添加项目需要的标准文件
#   # custom_standard: "path/to/standard.pdf"

