# DO-178C Constraints — Active Config (sr1)
# Based on RTCA DO-178C (2011) Annex A

metadata:
  standard: "RTCA DO-178C"
  version: "2011"
  doc_id: "DO-178C"

dal_levels:
  A:
    failure_condition: "Catastrophic"
    description: "失效将导致灾难性后果"
    objective_count: 66
    independence_required: true
    with_independence: 25
  B:
    failure_condition: "Hazardous/Severe-Major"
    description: "失效将严重影响安全裕度或机组能力"
    objective_count: 65
    independence_required: true
    with_independence: 14
  C:
    failure_condition: "Major"
    description: "失效将显著降低安全裕度或增加机组工作负担"
    objective_count: 58
    independence_required: false
    with_independence: 2
  D:
    failure_condition: "Minor"
    description: "失效不会显著降低飞机安全性"
    objective_count: 25
    independence_required: false
    with_independence: 0
  E:
    failure_condition: "No Safety Effect"
    description: "失效不影响飞机运行安全"
    objective_count: 0
    independence_required: false
    with_independence: 0

hlr_verification:
  - id: "A3-1"
    desc: "HLR comply with system requirements"
    applicable_DAL: [A, B, C, D]
    independence: [A, B]
    do178c_ref: "6.3.1.a"
    evidence_type: "review"
  - id: "A3-2"
    desc: "HLR are accurate and consistent"
    applicable_DAL: [A, B, C, D]
    independence: [A, B]
    do178c_ref: "6.3.1.b"
    evidence_type: "review"
  - id: "A3-3"
    desc: "HLR are compatible with target computer"
    applicable_DAL: [A, B]
    independence: []
    do178c_ref: "6.3.1.c"
    evidence_type: "analysis"
  - id: "A3-4"
    desc: "HLR are verifiable"
    applicable_DAL: [A, B, C]
    independence: []
    do178c_ref: "6.3.1.d"
    evidence_type: "review"
  - id: "A3-5"
    desc: "HLR conform to standards"
    applicable_DAL: [A, B, C]
    independence: []
    do178c_ref: "6.3.1.e"
    evidence_type: "review"
  - id: "A3-6"
    desc: "HLR are traceable to system requirements"
    applicable_DAL: [A, B, C, D]
    independence: []
    do178c_ref: "6.3.1.f"
    evidence_type: "analysis"
  - id: "A3-7"
    desc: "Algorithms are accurate"
    applicable_DAL: [A, B, C]
    independence: [A, B]
    do178c_ref: "6.3.1.g"
    evidence_type: "analysis"

llr_verification:
  - id: "A4-1"
    desc: "LLR comply with HLR"
    applicable_DAL: [A, B, C]
    independence: [A, B]
    do178c_ref: "6.3.2.a"
    evidence_type: "review"
  - id: "A4-2"
