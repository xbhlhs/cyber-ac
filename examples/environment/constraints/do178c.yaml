coding_verification:
  - id: "A5-1"
    desc: "Source Code complies with LLR"
    applicable_DAL: [A, B, C]
    independence: [A, B]
    do178c_ref: "6.3.4.a"
    evidence_type: "review"
  - id: "A5-2"
