# 公司规范 — 约束PLA路径选择
# 公司级规范覆盖所有项目，优先级高于DAL默认推荐

company_standards:
  model_policy: "model_optional"   # model_required | model_optional | model_prohibited
  # model_required: 所有项目必须基于模型开发，无论DAL
  # model_optional: 按DAL推荐决定是否需要模型
  # model_prohibited: 禁止使用模型，纯文本路径

  coding_standard: "MISRA-C:2012"
  documentation_language: "zh-CN"
  review_policy: "mandatory_for_all_dal"  # 所有DAL级别均需人工评审
