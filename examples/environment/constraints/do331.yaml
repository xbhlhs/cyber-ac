# DO-331 Constraints — Active Config
# Model-Based Development and Verification Supplement to DO-178C
#
# DO-331 是 DO-178C 的补充标准，仅在模型驱动路径时适用。
# 对于 DAL D 的 text_only 路径，大部分目标不适用。

metadata:
  standard: "RTCA DO-331"
  version: "2011"
  doc_id: "DO-331"
  title: "Model-Based Development and Verification Supplement to DO-178C and DO-278A"

model_types:
  specification:
    name: "规格模型 (Specification Model)"
    description: "描述软件需求的抽象表达"
    example: "SysML BDD/IBD/需求图表达 HLR"
    verification: "对应 HLR 验证目标 (A3-*)，加上 MB.A-3 专项检查"

  design:
    name: "设计模型 (Design Model)"
    description: "描述软件架构和详细设计"
    example: "SysML BDD/IBD 表达架构，UML 类图/状态机表达详细设计"
    verification: "对应 LLR 验证目标 (A4-*)，加上 MB.A-4 专项检查"

model_standards_required: true
model_standards:
  - "模型元素命名规范"
  - "模型与需求双向追溯"
  - "模型仿真验证要求"

mb_objectives:
  planning:
    - id: "MB.A-2.1"
      desc: "模型标准已定义并纳入软件计划"
      applicable_DAL: [A, B, C]
    - id: "MB.A-2.2"
      desc: "模型开发工具已鉴定或评估"
      applicable_DAL: [A, B, C]

  development:
    - id: "MB.A-3.1"
      desc: "规格模型符合系统需求"
      applicable_DAL: [A, B, C]
    - id: "MB.A-3.2"
      desc: "规格模型的仿真结果与预期一致"
      applicable_DAL: [A, B, C]
    - id: "MB.A-4.1"
      desc: "设计模型符合规格模型"
      applicable_DAL: [A, B, C]
    - id: "MB.A-4.2"
      desc: "设计模型的仿真结果与规格模型一致"
      applicable_DAL: [A, B]

  verification:
    - id: "MB.A-5.1"
      desc: "模型到代码的生成过程已验证"
      applicable_DAL: [A, B, C]

trigger_condition: "model_policy != 'text_only'"
