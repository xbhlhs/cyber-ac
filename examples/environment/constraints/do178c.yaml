    coverage_type: "MC/DC"
  - id: "A7-6"
    desc: "Decision Coverage"
    applicable_DAL: [A, B]
    coverage_type: "decision"
  - id: "A7-7"
    desc: "Statement Coverage"
    applicable_DAL: [A, B, C]
    coverage_type: "statement"
  - id: "A7-8"
    desc: "Data Coupling and Control Coupling"
    applicable_DAL: [A, B, C]
    coverage_type: "coupling"

